[tool.poetry]
name = "mpm"
# The version variable below is set to the generic build placeholder "0.0.0".
# (In other words: leave alone!) During CI, poetry dynamic versioning
# modifies the __version__ variable in the applicable __init__.py file.
version = "0.0.0"
description = "EPC Power Parameter Manager"
authors = ["Alex Anker <alex.anker@epcpower.com>"]
include = ["src/*"]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.poetry-dynamic-versioning.substitution]
#poetry-dynamic-versioning has auto subsitution for __init__.py files,
#but not for more than 1 directory out of root.
files = ["src/mpm/__init__.py"]

[[tool.poetry.source]]
name = "epc-power"
url = "https://epc-power-us-890711758583.d.codeartifact.us-east-2.amazonaws.com/pypi/epc-power/simple"
priority = "explicit"

[[tool.poetry.source]]
name = "third-party"
url = "https://epc-power-us-890711758583.d.codeartifact.us-east-2.amazonaws.com/pypi/third-party/simple"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.8,<3.11"
attrs = "20.2.0"
lxml = "5.2.1"
PyQt5 = "5.13.2"
requests = "2.27.1"
toolz = "0.9.0"
tox = "3.24.5"
xmldiff = "2.2"
openpyxl = "3.1.5"
canmatrix = "0.9.1"
graham = "0.1.11"
pyserial = "3.4"
pysunspec = "2.1.1"
pycparser = "2.21"
Twisted = "21.2.0"
python-can = "4.0.0"
Jinja2 = "^3.0.3"
click = "<=7.1.2"
qt5reactor = "0.6.3"
tqdm = "4.32.1"

[tool.poetry.group.dev.dependencies]
epyqlib = {path = "./sub/epyqlib",  develop = true}
gitignoreio = "0.1.5"
pyinstaller = "4.4"
pyinstaller-hooks-contrib = "2022.10" # Locks the version to avoid updating during `poetry update`
black = ">=20.8b1"
pytest = "6.2.4"
pytest-qt = "4.0.2"
pytest-cov = "2.5.1"
pytest-twisted = "<=1.13.4"
twine = "3.1.1"
# Can't do 0.21 because of https://github.com/python-poetry/poetry/issues/9293
docutils = "!=0.21.post1"

[tool.poetry.scripts]
mpmcli = 'mpm.cli.main:main'
epcparameterstoc = 'mpm.cli.parameterstoc:cli'
epcimportsym = 'mpm.cli.importsym:cli'
epcexportsym = 'mpm.cli.exportsym:cli'
epcexportdocx = 'mpm.cli.exportdocx:cli'
epcconvertparameters = 'mpm.cli.convertepp:cli'
builduimpm = 'mpm.builduimpm:compile_ui'
mpm = 'mpm.__main__:_entry_point'

[tool.black]
target-version =  ['py37']
include = '''
^/(
    | src/mpm/.*\.pyi?
)$
'''
exclude = './.venv'

[build-system]
requires = [
    "setuptools",
    "wheel",
    "poetry-core>=1.0.0",
    "poetry-dynamic-versioning>=1.0.0,<2.0.0",
]
build-backend = "poetry_dynamic_versioning.backend"
